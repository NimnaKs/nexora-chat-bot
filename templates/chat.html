{% extends "base.html" %} {% block title %}Chat with Documents{% endblock %} {%
block content %}
<div class="row">
  <div class="col-12">
    <div class="card chat-container">
      <div
        class="card-header d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0">Chat with Documents</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearChat()">
          Clear Chat
        </button>
      </div>
      <div class="card-body">
        <div id="chatMessages" class="chat-messages mb-3"></div>
        <div class="input-group">
          <input
            type="text"
            id="questionInput"
            class="form-control"
            placeholder="Ask a question..."
            onkeypress="if(event.key==='Enter') askQuestion()"
          />
          <button
            class="btn btn-outline-secondary"
            type="button"
            id="voiceBtn"
            onclick="toggleVoiceRecording()"
          >
            🎤
          </button>
          <button
            class="btn btn-primary"
            type="button"
            id="sendBtn"
            onclick="askQuestion()"
          >
            Send
          </button>
        </div>
        <div id="voiceStatus" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<style>
  .chat-container {
    height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .chat-messages {
    height: 70%;
    overflow-y: auto;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    padding: 1rem;
    background: #f8f9fa;
  }
  .message {
    display: flex;
    margin-bottom: 1rem;
  }
  .user-message {
    justify-content: flex-end;
  }
  .bot-message {
    justify-content: flex-start;
  }
  .message-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin: 0 0.5rem;
  }
  .message-content {
    max-width: 70%;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .user-message .message-content {
    background: #007bff;
    color: #fff;
    order: 1;
    border-bottom-right-radius: 0.25rem;
  }
  .bot-message .message-content {
    background: #fff;
    border: 1px solid #dee2e6;
    order: 2;
    border-bottom-left-radius: 0.25rem;
  }
  .loading-message {
    opacity: 0.7;
    font-style: italic;
  }
  .recording {
    background: #dc3545 !important;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0% {
      opacity: 1;
    }
    50% {
      opacity: 0.5;
    }
    100% {
      opacity: 1;
    }
  }
</style>
{% endblock %} {% block scripts %}
<script>
  let isRecording = false,
    mediaRecorder,
    audioChunks = [];

  document.addEventListener("DOMContentLoaded", () => {
    addMessageToChat(
      "bot",
      "Welcome! You can ask questions about the uploaded documents."
    );
  });

  function askQuestion() {
    const input = document.getElementById("questionInput");
    const question = input.value.trim();
    if (!question) return;

    addMessageToChat("user", question);
    input.value = "";

    const loadingId = addMessageToChat("bot", "Thinking...", true);
    fetch("/ask", {
      method: "POST",
      body: new URLSearchParams({ question }),
    })
      .then((res) => res.json())
      .then((data) => {
        removeMessage(loadingId);
        addMessageToChat(
          "bot",
          data.answer || "Error: " + (data.error || "Unknown")
        );
      })
      .catch((err) => {
        removeMessage(loadingId);
        addMessageToChat("bot", "Error: Unable to get response.");
        console.error(err);
      });
  }

  function addMessageToChat(type, text, isLoading = false) {
    const container = document.getElementById("chatMessages");
    const msg = document.createElement("div");
    msg.id = "msg_" + Date.now();
    msg.className = `message ${type}-message${
      isLoading ? " loading-message" : ""
    }`;
    msg.innerHTML = `
      <div class="message-avatar">${type === "user" ? "👤" : "🤖"}</div>
      <div class="message-content">${text}</div>
    `;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg.id;
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function clearChat() {
    const container = document.getElementById("chatMessages");
    container.innerHTML = "";
    addMessageToChat(
      "bot",
      "Chat cleared. Ask me anything about the documents."
    );
  }

  async function toggleVoiceRecording() {
    const btn = document.getElementById("voiceBtn"),
      status = document.getElementById("voiceStatus");
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: "audio/wav" });
          const data = new FormData();
          data.append("audio", blob, "speech.wav");
          status.textContent = "Converting speech to text…";
          const res = await fetch("/voice_to_text", {
            method: "POST",
            body: data,
          });
          const json = await res.json();
          if (json.text) {
            document.getElementById("questionInput").value = json.text;
            status.textContent = "🎙️ Converted!";
            setTimeout(() => (status.textContent = ""), 3000);
          } else {
            status.textContent = "Error converting speech.";
          }
        };
        mediaRecorder.start();
        isRecording = true;
        btn.classList.add("recording");
      } catch (e) {
        console.error(e);
      }
    } else {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach((t) => t.stop());
      isRecording = false;
      btn.classList.remove("recording");
    }
  }
</script>
{% endblock %}
